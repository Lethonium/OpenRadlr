name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      credits-tag:
        description: "Refresh contributor credits for an existing release tag (skip release creation)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        if: inputs.credits-tag == ''
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created == 'true' || inputs.credits-tag != ''
        with:
          persist-credentials: false

      - name: Credit release contributors
        if: steps.release.outputs.release_created == 'true' || inputs.credits-tag != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.credits-tag || steps.release.outputs.tag_name }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const credits = require('./.github/scripts/release-contributors.cjs');
            await credits({ github, ...context.repo, tag: process.env.RELEASE_TAG });
