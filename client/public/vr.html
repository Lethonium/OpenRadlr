<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenRadlr</title>
    <meta name="theme-color" content="#0f1216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/vr/main.js"></script>
  </head>
  <body class="vr-page">
    <div class="vr-stage">
      <canvas id="world3d" class="canvas-world" aria-label="3D view of the ride" data-i18n-attr="aria-label:vr.view"></canvas>
      <div id="labels3d" class="labels3d" aria-hidden="true"></div>
    </div>
    <header class="vr-head">
      <a class="vr-link" href="index.html" data-i18n="vr.back">Back to the app</a>
      <span class="vr-badge" id="vr-badge" data-i18n="vr.notLive" hidden>Not live</span>
      <button type="button" id="vr-camera" class="secondary" hidden></button>
      <button type="button" id="vr-enter" class="secondary" data-i18n="vr.enter" hidden>Enter VR</button>
      <button type="button" id="vr-preview" class="secondary" data-i18n="vr.preview" hidden>Preview VR</button>
      <button type="button" id="vr-forget" class="secondary" data-i18n="vr.forget" hidden>Forget this tablet</button>
    </header>
    <p class="vr-message" id="vr-unpaired" data-i18n="vr.notPaired" hidden>
      This screen is not paired with a tablet. In OpenRadlr on the tablet, pair a second screen, then use this device as a VR display.
    </p>
    <p class="vr-message" id="vr-invalid" data-i18n="vr.invalid" hidden>The tablet no longer accepts this screen. Pair it again.</p>
    <p class="vr-message" id="vr-waiting" hidden></p>
    <p class="vr-message" id="vr-note" hidden></p>
    <div class="vr-hud" id="vr-hud" aria-live="off" hidden>
      <div class="vr-stat"><span id="vr-power">–</span><small>W</small></div>
      <div class="vr-stat"><span id="vr-cadence">–</span><small>rpm</small></div>
      <div class="vr-stat"><span id="vr-speed">–</span><small id="vr-speed-unit"></small></div>
      <div class="vr-stat"><span id="vr-grade">–</span><small>%</small></div>
      <div class="vr-stat" id="vr-hr-stat"><span id="vr-hr">–</span><small>bpm</small></div>
    </div>
  </body>
</html>
