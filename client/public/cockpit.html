<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenRadlr</title>
    <meta name="theme-color" content="#0f1216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="cockpit.css" />
    <script type="module" src="js/cockpit/main.js"></script>
  </head>
  <body>
    <header class="cockpit-head">
      <a class="cockpit-link" href="index.html" data-i18n="cockpit.back">Back to the app</a>
      <span class="cockpit-badge" id="cockpit-badge" data-i18n="cockpit.notLive" hidden>Not live</span>
      <button type="button" class="cockpit-edit" id="cockpit-edit" data-i18n="cockpit.edit">Edit</button>
      <button type="button" class="cockpit-forget" id="cockpit-forget" data-i18n="cockpit.forget" hidden>Forget this tablet</button>
    </header>
    <main>
      <p class="cockpit-message" id="cockpit-unpaired" data-i18n="cockpit.notPaired" hidden>This screen is not paired with a tablet.</p>
      <p class="cockpit-message" id="cockpit-invalid" data-i18n="cockpit.invalid" hidden>The tablet no longer accepts this screen. Pair it again.</p>
      <div class="cockpit-pair" id="cockpit-pair-now" hidden>
        <button type="button" class="pair-button" id="cockpit-pair" data-i18n="screens.pairNow">Pair now</button>
        <div class="pair-entry" id="cockpit-entry" hidden>
          <p class="pair-hint" data-i18n="screens.pairNowHint">On the tablet, open Settings, Second screen, Pair a new screen. Then enter its code here.</p>
        </div>
      </div>
      <p class="cockpit-message" id="cockpit-waiting" hidden></p>
      <section class="cockpit-tiles" id="cockpit-tiles" hidden></section>
    </main>
    <div class="cockpit-toolbar" id="cockpit-toolbar" hidden>
      <button type="button" class="toolbar-button" id="cockpit-add" data-i18n="cockpit.add">Add a tile</button>
      <button type="button" class="toolbar-button" id="cockpit-reset" data-i18n="cockpit.reset">Reset</button>
      <button type="button" class="toolbar-button toolbar-done" id="cockpit-done" data-i18n="cockpit.done">Done</button>
    </div>
    <div class="cockpit-sheet" id="cockpit-sheet" hidden>
      <div class="sheet-panel">
        <div class="sheet-head">
          <span data-i18n="cockpit.add">Add a tile</span>
          <button type="button" class="sheet-close" id="cockpit-sheet-close" data-i18n="cockpit.close">Close</button>
        </div>
        <div class="sheet-list" id="cockpit-sheet-list"></div>
      </div>
    </div>
  </body>
</html>
