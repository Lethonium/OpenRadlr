apply plugin: 'com.android.application'

// The upload key that signs release bundles for Google Play (docs/app.md#google-play).
// It comes from app/android/keystore.properties (gitignored) or, e.g. in CI, from
// the OPENRADLR_UPLOAD_* environment variables. Without it, release builds are unsigned.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def uploadKey = { String name, String env -> System.getenv(env) ?: keystoreProperties.getProperty(name) }
def uploadStoreFile = uploadKey('storeFile', 'OPENRADLR_UPLOAD_STORE_FILE')
def bundledPreview = providers.gradleProperty('bundledPreview').map { it == 'true' }.getOrElse(false)

android {
    namespace = "com.openradlr.app"
    buildFeatures {
        buildConfig true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.openradlr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play takes every versionCode once: raise it for each upload.
        // The client comes from the server, so this only changes with the native shell.
        versionCode 5
        versionName "0.2.0"
        buildConfigField 'boolean', 'BUNDLED_PREVIEW', 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadStoreFile) {
            release {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadKey('storePassword', 'OPENRADLR_UPLOAD_STORE_PASSWORD')
                keyAlias uploadKey('keyAlias', 'OPENRADLR_UPLOAD_KEY_ALIAS')
                keyPassword uploadKey('keyPassword', 'OPENRADLR_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'BUNDLED_PREVIEW', bundledPreview.toString()
        }
        release {
            if (uploadStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.debug.assets.srcDir(layout.buildDirectory.dir('generated/previewAssets'))
    sourceSets.test.resources.srcDir('../../../client/test/fixtures')
}

// Opt-in developer build: current client assets with the configured live backend.
// Release bundles always keep the normal server-delivered client.
def previewAssets = tasks.register('preparePreviewAssets', Sync) {
    if (bundledPreview) {
        from('../../../client/public') { into 'bundled-preview' }
    }
    into layout.buildDirectory.dir('generated/previewAssets')
}
tasks.named('preBuild').configure { dependsOn previewAssets }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    // Keep the test APK's old split stdlibs aligned with the BLE plugin's Kotlin runtime.
    androidTestImplementation platform("org.jetbrains.kotlin:kotlin-bom:2.2.20")
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
